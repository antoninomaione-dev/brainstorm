<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coppa Cadet 2026 – Classifica</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f1f5f9;padding:10px;font-size:12px}
h2{font-size:14px;color:#1e3a5f;margin-bottom:4px}
.updated{font-size:11px;color:#94a3b8;margin-bottom:6px}
.comment{background:#e0f2fe;border:1px solid #38bdf8;border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px;color:#0369a1;line-height:1.4}
.hl-box{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:6px;margin-bottom:8px}
input{width:100%;padding:7px;border-radius:8px;border:1px solid #ccc;font-size:13px;margin-bottom:8px}
.card{background:white;border-radius:10px;padding:8px}
.row{margin-bottom:5px;padding:2px 4px;border-radius:6px}
.row.hl{background:#fffbeb}
.meta{display:flex;justify-content:space-between;margin-bottom:2px}
.name{color:#334155}.name.top{color:#b45309;font-weight:700}.name.hl{font-weight:700}
.score{font-weight:700;color:#1e3a5f}
.bar-bg{background:#e2e8f0;border-radius:4px;height:7px}
.bar{height:7px;border-radius:4px}
</style>
</head>
<body>
<h2>🏆 Finale 1 Coppa Cadet 2026</h2>
<div class="updated">Aggiornato il 9 maggio 2026 · ore 15:57</div>
<div class="comment">💬 Gara appena partita e già è un mare di parità! Quasi tutti a 200 punti — è come la partenza di una regata: tutti in fila, ma presto qualcuno scapperà via. Schiaffini è in acqua e pronta! ⛵</div>
<div class="hl-box">⭐ <b>Schiaffini</b> — nel gruppo · 200 punti</div>
<input id="s" placeholder="🔍 Cerca squadra..." oninput="filter()">
<div class="card" id="list"></div>
<script>
var raw=[

["Valussi Udine",190],
["I 7 triangolini",190],
["Betteloni",190],
["Ruini",190]
];

var MAX=244;

// calcolo posizioni con ex aequo
var data=[];
var rank=1;
for(var i=0;i<raw.length;i++){
var r=(i>0 && raw[i][1]===raw[i-1][1])?data[i-1][0]:rank;
data.push([r, raw[i][0], raw[i][1]]);
rank++;
}

function color(s,hl){
if(hl) return “#f59e0b”;
if(s>=230) return “#1d4ed8”;
if(s>=200) return “#3b82f6”;
return “#93c5fd”;
}
function medal(r){return r==1?“🥇”:r==2?“🥈”:r==3?“🥉”:r+”.”;}

function render(rows){
var html=””;
for(var i=0;i<rows.length;i++){
var r=rows[i][0], n=rows[i][1], s=rows[i][2];
var hl=(n===“Schiaffini”);
var pct=Math.round(s/MAX*100);
var nameClass=“name”+(r<=3?” top”:””)+(hl?” hl”:””);
html+=’<div class=“row’+(hl?” hl”:””)+’”>’;
html+=’<div class="meta">’;
html+=’<span class="'+nameClass+'">’+medal(r)+’ ‘+n+’</span>’;
html+=’<span class="score">’+s+’</span>’;
html+=’</div>’;
html+=’<div class="bar-bg"><div class="bar" style="width:'+pct+'%;background:'+color(s,hl)+'"></div></div>’;
html+=’</div>’;
}
document.getElementById(“list”).innerHTML=html;
}

function filter(){
var q=document.getElementById(“s”).value.toLowerCase();
if(!q){render(data);return;}
var filtered=[];
for(var i=0;i<data.length;i++){
if(data[i][1].toLowerCase().indexOf(q)>=0) filtered.push(data[i]);
}
render(filtered);
}

render(data);
</script>

</body>
</html>
