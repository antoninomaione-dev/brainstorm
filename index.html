.card{background:white;border-radius:10px;padding:8px}
.row{margin-bottom:6px;padding:3px 4px;border-radius:6px}
.hl{background:#fffbeb}
.meta{display:flex;justify-content:space-between;margin-bottom:3px}
.nm{color:#334155;font-size:12px}
.nm.gold{color:#b45309;font-weight:700}

.sc{font-weight:700;color:#1e3a5f;font-size:12px}

var M=359;

function go(){
  var q=document.getElementById("s").value.toLowerCase();
  var rows=q?D.filter(function(x){return x[1].toLowerCase().indexOf(q)>=0;}):D;
  var h="";
  for(var i=0;i<rows.length;i++){
    var r=rows[i][0],n=rows[i][1],s=rows[i][2];
    var hl=(n==="Schiaffini");
    var pct=Math.round(s/M*100);
    var col=hl?"#f59e0b":s>=300?"#1d4ed8":s>=220?"#3b82f6":"#93c5fd";
    var medal=r==1?"🥇":r==2?"🥈":r==3?"🥉":r+".";
    var nc="nm"+(r<=3?" gold":"")+(hl?" star":"");
    h+='<div class="row'+(hl?" hl":"")+'"><div class="meta"><span class="'+nc+'">'+medal+' '+n+'</span><span class="sc">'+s+'</span></div><div class="bg"><div class="bar" style="width:'+pct+'%;background:'+col+'"></div></div></div>';
  }
  document.getElementById("L").innerHTML=h;
}
go();
