<title>Coppa Benjamin – Classifica</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f1f5f9;padding:10px;font-size:12px}
h2{font-size:14px;color:#1e3a5f;margin-bottom:4px}
.updated{font-size:11px;color:#94a3b8;margin-bottom:8px}
.hl-box{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:6px;margin-bottom:8px}
input{width:100%;padding:7px;border-radius:8px;border:1px solid #ccc;font-size:13px;margin-bottom:8px}
.card{background:white;border-radius:10px;padding:8px}
.row{margin-bottom:5px;padding:2px 4px;border-radius:6px}
.row.hl{background:#fffbeb}
.meta{display:flex;justify-content:space-between;margin-bottom:2px}
.name{color:#334155}.name.top{color:#b45309;font-weight:700}.name.hl{font-weight:700}
.score{font-weight:700;color:#1e3a5f}
.bar-bg{background:#e2e8f0;border-radius:4px;height:7px}
.bar{height:7px;border-radius:4px}
</style>
</head>

const MAX=1275;
function color(s,hl){if(hl)return"#f59e0b";if(s>=700)return"#1d4ed8";if(s>=400)return"#3b82f6";return"#93c5fd";}
function medal(r){return r==1?"🥇":r==2?"🥈":r==3?"🥉":r+".";}
function render(rows){
  document.getElementById("list").innerHTML=rows.map(([r,n,s])=>{
    const hl=n==="Schiaffini";
    const pct=Math.round(s/MAX*100);
    return`<div class="row${hl?" hl":""}">
      <div class="meta">
        <span class="name${r<=3?" top":""}${hl?" hl":""}">${medal(r)} ${n}</span>
        <span class="score">${s}</span>
      </div>
      <div class="bar-bg"><div class="bar" style="width:${pct}%;background:${color(s,hl)}"></div></div>
    </div>`;
  }).join("");
}
function filter(){
  const q=document.getElementById("s").value.toLowerCase();
  render(q?data.filter(([,n])=>n.toLowerCase().includes(q)):data);
}
render(data);
